[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance"
version = "4.2.0"
description = "Resonance: control every BluOS player on your network"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "tbaur" }]
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "zeroconf>=0.153.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
  "mypy>=2.4.1",
  "httpx>=0.28.1",
  "respx>=0.23.1",
  "pip-audit>=2.10.1",
  "setuptools>=84.2.1",
]

[project.scripts]
resonance = "app.cli:main"

# A declared root lets an editable install use a plain .pth path instead of an import hook.
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
packages = ["app"]
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["app.main"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
